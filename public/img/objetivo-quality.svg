<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="highGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(40, 50)">
    <path d="M0 30 V0 H30 M310 0 H340 V30 M340 260 V290 H310 M30 290 H0 V260" fill="none" stroke="#512bd4" stroke-width="1.5" opacity="0.7" />

    <text x="20" y="35" font-family="monospace" font-size="16" fill="#512bd4" font-weight="bold" filter="url(#highGlow)">SYSTEM_SCALING_EXPANDED</text>
    <text x="20" y="70" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff" font-weight="bold">Escalabilidade</text>
    <text x="20" y="100" font-family="Segoe UI" font-size="14" fill="#8b949e">
      <tspan x="20" dy="0">Design de APIs e sistemas pensados</tspan>
      <tspan x="20" dy="22">para crescer com segurança total.</tspan>
    </text>

    <g transform="translate(170, 190)" opacity="0.5">
      <circle r="10" fill="none" stroke="#512bd4" stroke-width="1">
        <animate attributeName="r" values="10;70" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;0" dur="4s" repeatCount="indefinite" />
      </circle>
      <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#512bd4" stroke-width="0.5" stroke-dasharray="4,4" />
    </g>

    <text x="20" y="275" font-family="monospace" font-size="11" fill="#512bd4" font-weight="bold">#CleanArchitecture #DDD #HighAvailability</text>
  </g>

  <g transform="translate(430, 50)">
    <path d="M0 30 V0 H30 M310 0 H340 V30 M340 260 V290 H310 M30 290 H0 V260" fill="none" stroke="#3fb950" stroke-width="1.5" opacity="0.7" />

    <text x="20" y="35" font-family="monospace" font-size="16" fill="#3fb950" font-weight="bold" filter="url(#highGlow)">CORE_HEALTH_MONITOR</text>
    <text x="20" y="70" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff" font-weight="bold">Qualidade</text>
    <text x="20" y="100" font-family="Segoe UI" font-size="14" fill="#8b949e">
      <tspan x="20" dy="0">SonarQube e observabilidade ativa</tspan>
      <tspan x="20" dy="22">para garantir zero regressões.</tspan>
    </text>

    <polyline points="60,190 100,190 115,140 145,240 160,190 220,190" fill="none" stroke="#3fb950" stroke-width="3" filter="url(#highGlow)">
      <animate attributeName="stroke-dasharray" from="0, 600" to="600, 0" dur="2.5s" repeatCount="indefinite" />
    </polyline>

    <text x="20" y="275" font-family="monospace" font-size="11" fill="#3fb950" font-weight="bold">#SonarQube #UnitTests #Sentry</text>
  </g>

  <g transform="translate(820, 50)">
    <path d="M0 30 V0 H30 M310 0 H340 V30 M340 260 V290 H310 M30 290 H0 V260" fill="none" stroke="#d29922" stroke-width="1.5" opacity="0.7" />

    <text x="20" y="35" font-family="monospace" font-size="16" fill="#d29922" font-weight="bold" filter="url(#highGlow)">DEPLOY_PIPELINE_FLOW</text>
    <text x="20" y="70" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff" font-weight="bold">Entrega contínua</text>
    <text x="20" y="100" font-family="Segoe UI" font-size="14" fill="#8b949e">
      <tspan x="20" dy="0">CI/CD no Azure DevOps e GitFlow</tspan>
      <tspan x="20" dy="22">focados em releases confiáveis.</tspan>
    </text>

    <rect x="40" y="180" width="260" height="10" rx="5" fill="#1f2937" />
    <rect x="40" y="180" width="0" height="10" rx="5" fill="#d29922" filter="url(#highGlow)">
      <animate attributeName="width" values="0;260" dur="3s" repeatCount="indefinite" />
    </rect>
    <path d="M280 165 L300 185 L280 205" fill="none" stroke="#d29922" stroke-width="2" />

    <text x="20" y="275" font-family="monospace" font-size="11" fill="#d29922" font-weight="bold">#AzureDevOps #GitFlow #AutomatedDeploy</text>
  </g>

</svg>
