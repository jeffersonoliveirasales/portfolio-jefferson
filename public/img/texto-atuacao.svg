<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#e6edf3">
    
    <text x="20" y="40" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0s" fill="freeze" />
      <tspan fill="#6e7681">1</tspan>  Atuar como <tspan fill="#79c0ff" font-weight="bold">Full Stack Senior</tspan>
    </text>

    <text x="20" y="70" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze" />
      <tspan fill="#6e7681">2</tspan>  aplicando experiência avançada em <tspan fill="#7ee787" font-weight="bold">.NET e Angular</tspan>,
    </text>

    <text x="20" y="100" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze" />
      <tspan fill="#6e7681">3</tspan>  arquitetura de APIs, <tspan fill="#d2a8ff">Clean Architecture</tspan>,
    </text>

    <text x="20" y="130" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3s" fill="freeze" />
      <tspan fill="#6e7681">4</tspan>  integrações complexas e <tspan fill="#ffa657">CI/CD</tspan> - 
    </text>

    <text x="20" y="160" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4s" fill="freeze" />
      <tspan fill="#6e7681">5</tspan>  contribuindo com soluções:
    </text>

    <text x="50" y="190">
      <tspan fill="#7ee787" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="5s" fill="freeze" />
        • escaláveis
      </tspan>
      <tspan fill="#79c0ff" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="5.5s" fill="freeze" />
        , performáticas
      </tspan>
      <tspan fill="#dbe6f2" font-weight="bold" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="6.2s" fill="freeze" />
        e de alta qualidade.
      </tspan>
    </text>
  </g>

  <rect width="8" height="18" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" 
      values="350 175; 350 175; 350 175" 
      dur="0.1s" begin="6.2s" fill="freeze" />
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="7s" fill="freeze" />
    <set attributeName="x" to="415" begin="7s" />
    <set attributeName="y" to="175" begin="7s" />
  </rect>
</svg>
