<section class="section" id="experiencia" data-section>
  <div class="section__inner">
    <header class="section__header" data-reveal>
      <app-gradient-wave-text
        class="section__eyebrow"
        align="left"
        [speed]="0.9"
        [inView]="true"
        [once]="false"
        [bottomOffset]="0"
        [bandCount]="4"
        [bandGap]="6"
        palette="subtle"
      >
        {{ 'experience.eyebrow' | translate }}
      </app-gradient-wave-text>
      <app-fx-title
        class="section__title section__title--shine"
        [text]="'experience.title' | translate"
        size="section"
      ></app-fx-title>
      <p class="section__lead">{{ 'experience.lead' | translate }}</p>
    </header>

    <div class="slot slot--experience" data-3d-slot="experience" aria-hidden="true"></div>

    @if (svgVisible()) {
      <app-experience-evolution-svg />
    }
  </div>
</section>
