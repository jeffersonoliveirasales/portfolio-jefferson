<div
  #container
  class="evolution-scroll"
  [class.is-dragging]="isDragging"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (lostpointercapture)="onPointerUp($event)"
>
  <svg
    class="evolution-svg"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 3400 850"
    preserveAspectRatio="xMinYMid meet"
  >
    <defs>
      <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur1" />
        <feGaussianBlur stdDeviation="8" result="blur2" />
        <feMerge>
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <linearGradient id="circuitLine" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00e5ff" />
        <stop offset="35%" stop-color="#0077ff" />
        <stop offset="65%" stop-color="#d900ff" />
        <stop offset="85%" stop-color="#ff0055" />
        <stop offset="100%" stop-color="#ffcc00" />
      </linearGradient>
    </defs>

    <style>
      .draw-trace {
        stroke-dasharray: 4000;
        stroke-dashoffset: 4000;
        animation: drawPath 4.5s ease-out forwards;
      }
      @keyframes drawPath {
        to {
          stroke-dashoffset: 0;
        }
      }

      .energy-stream {
        stroke-dasharray: 15 60;
        animation: flowData 2s linear infinite;
        opacity: 0.8;
      }
      @keyframes flowData {
        to {
          stroke-dashoffset: -75;
        }
      }

      .reveal-node {
        opacity: 0;
        transform-origin: center;
        animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes popUp {
        0% {
          opacity: 0;
          transform: scale(0.5) translateY(20px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .cyber-card {
        background: linear-gradient(135deg, rgba(5, 10, 21, 0.85) 0%, rgba(13, 22, 43, 0.95) 100%);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 229, 255, 0.15);
        border-left: 3px solid #00e5ff;
        border-radius: 0 24px 0 24px;
        box-shadow: 0 8px 32px rgba(0, 229, 255, 0.08);
        padding: 20px;
        color: #e2e8f0;
        font-family: 'Segoe UI', Roboto, sans-serif;
        box-sizing: border-box;
        transition: all 0.3s ease;
      }
      .cyber-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px rgba(0, 229, 255, 0.2);
        border-color: rgba(0, 229, 255, 0.4);
      }

      .theme-azure {
        border-left-color: #0077ff;
        box-shadow: 0 8px 32px rgba(0, 119, 255, 0.1);
      }
      .theme-azure .year {
        color: #0077ff;
      }
      .theme-azure .badge {
        background: rgba(0, 119, 255, 0.1);
        border-color: rgba(0, 119, 255, 0.3);
        color: #60a5fa;
      }

      .theme-pink {
        border-left-color: #d900ff;
        box-shadow: 0 8px 32px rgba(217, 0, 255, 0.1);
      }
      .theme-pink .year {
        color: #d900ff;
      }
      .theme-pink .badge {
        background: rgba(217, 0, 255, 0.1);
        border-color: rgba(217, 0, 255, 0.3);
        color: #e879f9;
      }

      .theme-red {
        border-left-color: #ff0055;
        box-shadow: 0 8px 32px rgba(255, 0, 85, 0.1);
      }
      .theme-red .year {
        color: #ff0055;
      }
      .theme-red .badge {
        background: rgba(255, 0, 85, 0.1);
        border-color: rgba(255, 0, 85, 0.3);
        color: #fb7185;
      }

      .theme-gold {
        background: linear-gradient(135deg, rgba(30, 25, 10, 0.9) 0%, rgba(43, 35, 13, 0.95) 100%);
        border-left: 4px solid #ffcc00;
        box-shadow: 0 10px 40px rgba(255, 204, 0, 0.15);
        border-radius: 8px 24px 8px 24px;
      }
      .theme-gold .year {
        color: #ffcc00;
      }
      .theme-gold .badge {
        background: rgba(255, 204, 0, 0.15);
        border-color: rgba(255, 204, 0, 0.4);
        color: #fde047;
      }

      .year {
        font-size: 13px;
        font-weight: 800;
        color: #00e5ff;
        letter-spacing: 2px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .role {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        margin: 0 0 4px 0;
      }
      .company {
        font-size: 14px;
        font-weight: 500;
        color: #94a3b8;
        margin: 0 0 14px 0;
      }
      .desc {
        font-size: 13.5px;
        line-height: 1.6;
        color: #cbd5e1;
        margin: 0 0 16px 0;
      }
      .techs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .badge {
        background: rgba(0, 229, 255, 0.1);
        border: 1px solid rgba(0, 229, 255, 0.3);
        color: #67e8f9;
        font-size: 11px;
        padding: 5px 10px;
        border-radius: 4px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
    </style>

    <path d="M 50 435 L 235 435 L 290 490" stroke="rgba(0, 229, 255, 0.1)" stroke-width="2" fill="none" />
    <path d="M 50 415 L 255 415 L 310 360" stroke="rgba(0, 229, 255, 0.1)" stroke-width="2" fill="none" />
    <path d="M 1750 360 L 1800 360 L 1900 460" stroke="rgba(217, 0, 255, 0.1)" stroke-width="2" fill="none" />

    <g>
      <path
        d="M 50 425 L 245 425 L 300 480 L 590 480 L 700 370 L 990 370 L 1100 480 L 1390 480 L 1500 370 L 1790 370 L 1900 480 L 2190 480 L 2300 370 L 2590 370 L 2700 480 L 2990 480 L 3100 370 L 3350 370"
        stroke="#0f172a"
        stroke-width="8"
        fill="none"
        stroke-linejoin="bevel"
      />

      <path
        d="M 50 425 L 245 425 L 300 480 L 590 480 L 700 370 L 990 370 L 1100 480 L 1390 480 L 1500 370 L 1790 370 L 1900 480 L 2190 480 L 2300 370 L 2590 370 L 2700 480 L 2990 480 L 3100 370 L 3350 370"
        stroke="url(#circuitLine)"
        stroke-width="4"
        fill="none"
        class="draw-trace"
        stroke-linejoin="bevel"
      />

      <path
        d="M 50 425 L 245 425 L 300 480 L 590 480 L 700 370 L 990 370 L 1100 480 L 1390 480 L 1500 370 L 1790 370 L 1900 480 L 2190 480 L 2300 370 L 2590 370 L 2700 480 L 2990 480 L 3100 370 L 3350 370"
        stroke="#ffffff"
        stroke-width="2"
        fill="none"
        class="energy-stream"
        stroke-linejoin="bevel"
        filter="url(#glowCyan)"
      />
    </g>

    <g class="reveal-node" style="animation-delay: 0.5s;">
      <line x1="300" y1="480" x2="300" y2="520" stroke="#00e5ff" stroke-width="2" />
      <circle cx="300" cy="480" r="10" fill="#050a15" stroke="#00e5ff" stroke-width="3" filter="url(#glowCyan)" />
      <circle cx="300" cy="480" r="3" fill="#ffffff" />
      <rect x="180" y="422" width="10" height="6" fill="#050a15" stroke="#00e5ff" stroke-width="1.5" />

      <foreignObject x="140" y="520" width="320" height="320">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card">
          <div class="year">2010–2015</div>
          <h3 class="role">Estagiário a Pleno</h3>
          <h4 class="company">Confitec</h4>
          <p class="desc">Manutenção e tuning para setor imobiliário. Foco extremo em arquitetura monolítica e sistemas legados complexos.</p>
          <div class="techs"><span class="badge">C#</span><span class="badge">WebForms</span><span class="badge">SQL Server</span></div>
        </div>
      </foreignObject>
    </g>

    <g class="reveal-node" style="animation-delay: 1.0s;">
      <line x1="700" y1="370" x2="700" y2="330" stroke="#00e5ff" stroke-width="2" />
      <circle cx="700" cy="370" r="10" fill="#050a15" stroke="#00e5ff" stroke-width="3" filter="url(#glowCyan)" />
      <circle cx="700" cy="370" r="3" fill="#ffffff" />

      <foreignObject x="540" y="30" width="320" height="300">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card" style="position: absolute; bottom: 0; width: 100%;">
          <div class="year">2016–2017</div>
          <h3 class="role">Analista Pleno</h3>
          <h4 class="company">CTIS Tecnologia</h4>
          <p class="desc">Sistemas para área de educação municipal do RJ. Coordenação diária de tarefas através de fluxo e rotinas ágeis.</p>
          <div class="techs"><span class="badge">C#</span><span class="badge">ASP.NET</span><span class="badge">Kanban</span></div>
        </div>
      </foreignObject>
    </g>

    <g class="reveal-node" style="animation-delay: 1.5s;">
      <line x1="1100" y1="480" x2="1100" y2="520" stroke="#0077ff" stroke-width="2" />
      <circle cx="1100" cy="480" r="10" fill="#050a15" stroke="#0077ff" stroke-width="3" filter="url(#glowCyan)" />
      <circle cx="1100" cy="480" r="3" fill="#ffffff" />
      <rect x="850" y="367" width="10" height="6" fill="#050a15" stroke="#0077ff" stroke-width="1.5" />

      <foreignObject x="940" y="520" width="320" height="320">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card theme-azure">
          <div class="year">2017–2019</div>
          <h3 class="role">Analista Pleno</h3>
          <h4 class="company">TIVIT</h4>
          <p class="desc">Rastreamento de veículos. Integração crítica entre infraestruturas de backend corporativas e aplicações mobile.</p>
          <div class="techs"><span class="badge">ASP.NET</span><span class="badge">Android Java</span><span class="badge">Oracle</span></div>
        </div>
      </foreignObject>
    </g>

    <g class="reveal-node" style="animation-delay: 2.0s;">
      <line x1="1500" y1="370" x2="1500" y2="330" stroke="#0077ff" stroke-width="2" />
      <circle cx="1500" cy="370" r="10" fill="#050a15" stroke="#0077ff" stroke-width="3" filter="url(#glowCyan)" />
      <circle cx="1500" cy="370" r="3" fill="#ffffff" />

      <foreignObject x="1340" y="30" width="320" height="300">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card theme-azure" style="position: absolute; bottom: 0; width: 100%;">
          <div class="year">2019</div>
          <h3 class="role">Analista Pleno</h3>
          <h4 class="company">Quality S.A. / Wilson Sons</h4>
          <p class="desc">Evolução do software corporativo de Recursos Humanos, criando e melhorando interfaces focadas em PLR.</p>
          <div class="techs"><span class="badge">C# MVC 6</span><span class="badge">Entity FW</span><span class="badge">Oracle</span></div>
        </div>
      </foreignObject>
    </g>

    <g class="reveal-node" style="animation-delay: 2.5s;">
      <line x1="1900" y1="480" x2="1900" y2="520" stroke="#d900ff" stroke-width="2" />
      <circle cx="1900" cy="480" r="10" fill="#050a15" stroke="#d900ff" stroke-width="3" filter="url(#glowPink)" />
      <circle cx="1900" cy="480" r="3" fill="#ffffff" />
      <rect x="1650" y="367" width="10" height="6" fill="#050a15" stroke="#d900ff" stroke-width="1.5" />

      <foreignObject x="1740" y="520" width="320" height="320">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card theme-pink">
          <div class="year">2020–2022</div>
          <h3 class="role">Analista Pleno</h3>
          <h4 class="company">BRQ / Seguradora Líder</h4>
          <p class="desc">Modernização de software jurídico. Atuação intensiva em melhoria de performance e refatoração modular.</p>
          <div class="techs"><span class="badge">Web.Api</span><span class="badge">jQuery</span><span class="badge">SQL Server</span></div>
        </div>
      </foreignObject>
    </g>

    <g class="reveal-node" style="animation-delay: 3.0s;">
      <line x1="2300" y1="370" x2="2300" y2="330" stroke="#d900ff" stroke-width="2" />
      <circle cx="2300" cy="370" r="10" fill="#050a15" stroke="#d900ff" stroke-width="3" filter="url(#glowPink)" />
      <circle cx="2300" cy="370" r="3" fill="#ffffff" />

      <foreignObject x="2140" y="30" width="320" height="300">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card theme-pink" style="position: absolute; bottom: 0; width: 100%;">
          <div class="year">2022–2023</div>
          <h3 class="role">Analista Pleno</h3>
          <h4 class="company">Mercanet</h4>
          <p class="desc">Projeto estrutural de manutenção e migração técnica. Transformação de sistemas legados para stacks modernas.</p>
          <div class="techs"><span class="badge">WebForms</span><span class="badge">NHibernate</span><span class="badge">Knockout</span></div>
        </div>
      </foreignObject>
    </g>

    <g class="reveal-node" style="animation-delay: 3.5s;">
      <line x1="2700" y1="480" x2="2700" y2="520" stroke="#ff0055" stroke-width="2" />
      <circle cx="2700" cy="480" r="10" fill="#050a15" stroke="#ff0055" stroke-width="3" filter="url(#glowPink)" />
      <circle cx="2700" cy="480" r="3" fill="#ffffff" />
      <rect x="2450" y="367" width="10" height="6" fill="#050a15" stroke="#ff0055" stroke-width="1.5" />

      <foreignObject x="2540" y="520" width="320" height="320">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card theme-red">
          <div class="year">2023–2024</div>
          <h3 class="role">Analista Sênior</h3>
          <h4 class="company">G4F</h4>
          <p class="desc">Arquiteto de APIs REST e DLLs. Salto para o ecossistema moderno assumindo gestão Full-Stack ponta a ponta.</p>
          <div class="techs"><span class="badge">.NET Core</span><span class="badge">Angular 15</span><span class="badge">REST</span></div>
        </div>
      </foreignObject>
    </g>

    <g class="reveal-node" style="animation-delay: 4.0s;">
      <line x1="3100" y1="370" x2="3100" y2="330" stroke="#ffcc00" stroke-width="2" />
      <line x1="3090" y1="370" x2="3090" y2="330" stroke="#ffcc00" stroke-width="1.5" opacity="0.5" />
      <line x1="3110" y1="370" x2="3110" y2="330" stroke="#ffcc00" stroke-width="1.5" opacity="0.5" />

      <rect x="3084" y="354" width="32" height="32" fill="#050a15" stroke="#ffcc00" stroke-width="3" rx="4" filter="url(#glowGold)" />
      <rect x="3092" y="362" width="16" height="16" fill="#ffcc00" opacity="0.8" rx="2" />

      <foreignObject x="2940" y="20" width="320" height="300">
        <div xmlns="http://www.w3.org/1999/xhtml" class="cyber-card theme-gold" style="position: absolute; bottom: 0; width: 100%;">
          <div class="year">2024–Atual</div>
          <h3 class="role" style="font-size: 22px;">Full Stack Sênior</h3>
          <h4 class="company" style="color: #fcd34d;">CCAA</h4>
          <p class="desc" style="color: #fef08a;">O topo do processamento! Desenvolvimento focado em alta modularidade. CI/CD robusto, versionamento Git eficiente e entregas escaláveis de alto impacto.</p>
          <div class="techs"><span class="badge">.NET Core</span><span class="badge">Angular 19</span><span class="badge">Azure DevOps</span></div>
        </div>
      </foreignObject>
    </g>
  </svg>
</div>
